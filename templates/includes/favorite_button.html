<form action="/favorites/toggle/{{ product_id }}/" method="post" class="favorite-form" data-favorite-form data-product-id="{{ product_id }}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.path }}">
  <button
    type="submit"
    class="favorite-toggle{% if is_favorite %} is-active{% endif %}"
    aria-pressed="{% if is_favorite %}true{% else %}false{% endif %}"
    aria-label="{% if is_favorite %}Убрать из избранного{% else %}Добавить в избранное{% endif %}"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
  </button>
</form>

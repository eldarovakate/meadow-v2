{% load wagtailimages_tags favorite_tags %}
<div class="product-carousel" data-carousel>
  <button type="button" class="product-carousel__arrow product-carousel__arrow--prev" data-carousel-prev aria-label="Предыдущие товары">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <div class="product-carousel__viewport" data-carousel-viewport>
    <div class="product-carousel__track" data-carousel-track>
      {% for page in products %}
      {% with product=page.specific %}
      {% include "includes/product_card.html" with product=product favorite_ids=favorite_ids extra_class="product-carousel__item" %}
      {% endwith %}
      {% endfor %}
    </div>
  </div>
  <button type="button" class="product-carousel__arrow product-carousel__arrow--next" data-carousel-next aria-label="Следующие товары">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>
</div>

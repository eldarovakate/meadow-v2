{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block body_class %}contact-page contact-page--landing{% endblock %}

{% block content %}

<section class="page-hero">
  <div class="container">
    <div class="page-hero__inner reveal">
      <span class="label">Контакты</span>
      <h1 class="page-hero__title">{{ page.thank_you_title }}</h1>
      {% if page.thank_you_text %}
      <div class="page-hero__sub richtext">{{ page.thank_you_text|richtext }}</div>
      {% endif %}
    </div>
  </div>
</section>

<section class="contact-section">
  <div class="container">
    <div class="contact-thank-you-actions reveal">
      <a href="{{ page.url }}" class="btn btn--primary">Вернуться к контактам</a>
    </div>
  </div>
</section>

{% endblock %}
